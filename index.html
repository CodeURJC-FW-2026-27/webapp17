<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="La carta de Sakura Buffet: sushi, entrantes y platos para compartir.">
    <title>Carta | Sakura Buffet</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="css/menu.css">
</head>
<body id="page-top">
    <header class="site-header">
        <nav class="navbar" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand restaurant-brand" href="index.html">
                    <span class="restaurant-seal" aria-hidden="true">桜</span>
                    <span>
                        <span class="restaurant-name">Sakura</span>
                        <span class="restaurant-tagline">Buffet japonés</span>
                    </span>
                </a>
                <div class="d-flex gap-3">
                    <a class="nav-link" href="index.html#page-top">Inicio</a>
                    <a class="nav-link" href="index.html#menu-grid">Carta</a>
                </div>
            </div>
        </nav>

        <div class="menu-tools">
            <div class="container">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-lg-5">
                        <div class="menu-search" role="search">
                            <label class="form-label" for="plate-search">Buscar por nombre</label>
                            <div class="input-group">
                                <input class="form-control" type="search" id="plate-search" name="search" placeholder="Ej.: nigiri, udon, tempura…">
                                <button class="btn search-button" type="button">Buscar</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-7">
                        <p class="form-label" id="category-label">Tipos de plato</p>
                        <div class="d-flex flex-wrap gap-2" role="group" aria-labelledby="category-label">
                            <button class="btn category-button active" type="button" aria-pressed="true">Todos</button>
                            <button class="btn category-button" type="button" aria-pressed="false">Entrante</button>
                            <button class="btn category-button" type="button" aria-pressed="false">Sushi</button>
                            <button class="btn category-button" type="button" aria-pressed="false">Principal</button>
                            <button class="btn category-button" type="button" aria-pressed="false">Postre</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
