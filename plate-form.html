<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo plato | Sakura Buffet</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <body id="page-top">
    <header class="site-header">
      <nav class="navbar" aria-label="Navegación principal">
        <div class="container">
          <a class="navbar-brand restaurant-brand" href="index.html">
            <span class="restaurant-seal" aria-hidden="true">桜</span>
            <span>
              <span class="restaurant-name">Sakura</span>
              <span class="restaurant-tagline">Buffet japonés</span>
            </span>
          </a>
          <div class="d-flex gap-3">
            <a class="nav-link" href="index.html#page-top">Inicio</a>
            <a class="nav-link" href="index.html#menu-grid">Carta</a>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="menu-section" aria-labelledby="menu-title">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
              <div class="menu-heading mb-4">
                <h1 class="menu-title" id="menu-title">Crear un <span class="menu-title-accent">plato</span></h1>
              </div>
              <div class="form-panel">
                <form class="plate-form">
                  <div class="row g-3">
                    <div class="col-12 col-md-8">
                      <label class="form-label" for="plate-name">Nombre</label>
                      <input class="form-control" type="text" id="plate-name" name="name" required />
                    </div>
                    <div class="col-12 col-md-4">
                      <label class="form-label" for="plate-type">Tipo de plato</label>
                      <select class="form-select" id="plate-type" name="type" required>
                        <option value="" selected disabled>Selecciona un tipo</option>
                        <option value="starter">Entrante</option>
                        <option value="sushi">Sushi</option>
                        <option value="main">Principal</option>
                        <option value="dessert">Postre</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="plate-description">Descripción</label>
                      <textarea class="form-control" id="plate-description" name="description" rows="5" required></textarea>
                    </div>
                    <div class="col-12 col-md-6">
                      <label class="form-label" for="plate-price">Precio (€)</label>
                      <input class="form-control" type="number" id="plate-price" name="price" required />
                    </div>
                    <div class="col-12 col-md-6">
                      <label class="form-label" for="plate-preparation-time">Tiempo de preparación (minutos)</label>
                      <input class="form-control" type="number" id="plate-preparation-time" name="preparation_time" required />
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
